# Один сервис бота. Файл SQLite в ./data проекта. Профиль: pubmed-bot
services:
  bot:
    build: .
    pull_policy: build
    profiles: ['pubmed-bot']
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/pubmed.db
    volumes:
      - ./data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
