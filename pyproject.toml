[project]
name = "pubmed-bot"
version = "0.1.0"
description = "Telegram bot for PubMed search and translation"
requires-python = "==3.14.*"
dependencies = [
    "aiogram==3.30.0",
    "aiosqlite==0.22.1",
    "alembic==1.19.1",
    "apscheduler==3.11.3",
    "deepl==1.30.0",
    "httpx==0.28.1",
    "openai==2.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmed_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402", "E501", "I001", "UP007", "UP035"]
"src/pubmed_bot/adapters/llm/gemini_rewriter.py" = ["E501"]

[tool.ty.rules]
all = "error"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "respx==0.23.1",
    "ruff==0.16.3",
    "ty==0.0.71",
]
